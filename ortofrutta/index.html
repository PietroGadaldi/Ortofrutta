    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registrato con successo:', registration);
            })
            .catch((error) => {
              console.error('[PWA] Errore nella registrazione del Service Worker:', error);
            });
        });
      } else {
        console.warn('[PWA] Browser non supporta Service Workers');
      }
    </script>
